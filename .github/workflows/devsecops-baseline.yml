name: DevSecOps Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  prepare-evidence:
    name: Prepare Evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Build artifact and evidence
        run: |
          mkdir -p dist security governance
          tar --exclude='.git' --exclude='dist' --exclude='security' --exclude='governance' -czf dist/application-source.tar.gz .
          export ARTIFACT_DIGEST="$(sha256sum dist/application-source.tar.gz | awk '{print $1}')"

          cat > security/sbom.cyclonedx.json <<'JSON'
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.5",
            "version": 1,
            "metadata": {
              "component": {
                "type": "application",
                "name": "governance-framework-demo-consumer"
              }
            },
            "components": []
          }
          JSON

          cat > security/vulnerability-scan.json <<'JSON'
          {
            "scanner": "placeholder",
            "max_severity": "none",
            "findings": []
          }
          JSON

          python3 - <<PY
          import json
          import os
          from pathlib import Path

          event_name = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          ref_name = os.environ.get("GITHUB_REF_NAME", "unknown")
          release_context = event_name == "push" and ref_name == "main"
          purpose = "release" if release_context else "pull_request_validation" if event_name == "pull_request" else "diagnostic"

          payload = {
              "contract_version": "1.0",
              "release_candidate": True,
              "run_context": {
                  "event": event_name,
                  "purpose": purpose,
                  "release_context": release_context,
                  "source": "demo-consumer-workflow",
              },
              "required_platform_level": "PRA-Level 1",
              "repository": {
                  "protected_branch": False,
                  "direct_push_allowed": True,
                  "review_required": False,
              },
              "traceability": {
                  "requirements_linked": False,
                  "testcases_linked": True,
                  "reports_linked": True,
              },
              "source_control": {
                  "approved_vcs": True,
                  "identifiable_authors": True,
                  "review_records_present": event_name == "pull_request",
              },
              "static_analysis": {
                  "performed": False,
                  "findings_reviewed": False,
              },
              "evidence": {
                  "sbom": {
                      "exists": True,
                      "linked_to_artifact": True,
                  },
                  "vulnerability_scan": {
                      "exists": True,
                      "path": "security/vulnerability-scan.json",
                      "max_severity": "none",
                  },
              },
              "artifact": {
                  "artifact_id": "application-source.tar.gz",
                  "artifact_type": "application-source",
                  "artifact_version": os.environ.get("GITHUB_SHA", "local")[:12],
                  "digest": {
                      "exists": True,
                      "linked_to_artifact": True,
                      "algorithm": "sha256",
                      "value": os.environ["ARTIFACT_DIGEST"],
                  },
                  "signature": {
                      "exists": False,
                  },
              },
              "pipeline": {
                  "pipeline_id": "DevSecOps Baseline",
                  "pipeline_run_id": os.environ.get("GITHUB_RUN_ID", "local"),
                  "commit_id": os.environ.get("GITHUB_SHA", "local"),
                  "event": event_name,
                  "status": "success",
                  "security_gates": {
                      "enforced": False,
                  },
                  "security_thresholds_exceeded": False,
                  "external_direct_downloads_detected": False,
              },
              "operations": {
                  "deployed_versions_recorded": False,
                  "security_events_recorded": False,
              },
              "waivers": [],
          }

          Path("governance/governance-run-input.json").write_text(json.dumps(payload, indent=2) + "\\n", encoding="utf-8")
          PY

      - name: Upload application evidence
        uses: actions/upload-artifact@v4
        with:
          name: application-evidence
          path: |
            dist/application-source.tar.gz
            security/sbom.cyclonedx.json
            security/vulnerability-scan.json
            governance/governance-run-input.json

  devsecops-baseline:
    name: Central DevSecOps Baseline
    needs: prepare-evidence
    uses: joku-dev/devsecops-governance-framework/.github/workflows/devsecops-baseline-l1-v1.1.3.yml@l1-baseline-v1.1.3
    with:
      governance_mode: report-only
      max_allowed_severity: high
      artifact_path: dist/application-source.tar.gz
      sbom_path: security/sbom.cyclonedx.json
      vulnerability_scan_path: security/vulnerability-scan.json
      governance_run_input_path: governance/governance-run-input.json
      application_evidence_artifact_name: application-evidence
      generate_demo_evidence: false
