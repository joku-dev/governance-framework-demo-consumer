name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests

      - name: Collect report-only runtime diagnostics
        if: always()
        env:
          PYTHONPATH: src
          DIAGNOSTIC_COMMIT: ${{ github.sha }}
          DIAGNOSTIC_RUN: ${{ github.run_id }}
        run: |
          python3 scripts/run_runtime_diagnostics.py \
            --commit "$DIAGNOSTIC_COMMIT" --run-id "$DIAGNOSTIC_RUN" \
            --output evidence/runtime-diagnostics.json

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-runtime-diagnostics
          path: evidence/runtime-diagnostics.json
          if-no-files-found: error
